# Isolated fixture only. This does not deploy an API, worker, or production data.
name: unichatgo-async-isolated
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${UNICHATGO_TEST_MYSQL_PASSWORD:?Set a throwaway test-only MySQL password}
      MYSQL_DATABASE: unichatgo_async_test
    ports:
      - "127.0.0.1:${UNICHATGO_TEST_MYSQL_PORT:-13317}:3306"
    volumes:
      - mysql-isolated:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=67108864
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping --silent -h 127.0.0.1 -u root"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  redis:
    image: redis:7.4
    ports:
      - "127.0.0.1:${UNICHATGO_TEST_REDIS_PORT:-16387}:6379"
    volumes:
      - redis-isolated:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mysql-isolated:
  redis-isolated:
